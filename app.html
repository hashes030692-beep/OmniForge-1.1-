<!doctype html>
<html lang="en" class="h-full bg-[#121016]">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniForge 1.1 - AI Image Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            pink: '#f43f5e',
                            purple: '#8b5cf6',
                            blue: '#3b82f6',
                            dark: '#141217',
                            card: '#1e1a24',
                            panel: '#616068',
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 4s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.6', transform: 'scale(1)' },
                            '50%': { opacity: '0.9', transform: 'scale(1.02)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' },
                        }
                    }
                }
            }
        }
    </script>
  <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #28212d 0%, #17141d 50%, #0d0b11 100%);
            min-height: 100vh;
            color: #ffffff;
            user-select: none;
        }
        .spotlight-bg {
            background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.05) 0%, rgba(0, 0, 0, 0.6) 80%);
        }
        .omniforge-title-gradient {
            background: linear-gradient(90deg, #ff2a8d 0%, #d946ef 35%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .blue-submit-btn {
            background: linear-gradient(180deg, #8cb3e8 0%, #578bd6 40%, #2f65b8 100%);
            box-shadow: 0px 4px 12px rgba(47, 101, 184, 0.4), inset 0px 1px 1px rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
        }
        .blue-submit-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0px 6px 16px rgba(47, 101, 184, 0.6), inset 0px 1px 1px rgba(255, 255, 255, 0.8);
        }
        .blue-submit-btn:active {
            transform: translateY(1px);
            filter: brightness(0.95);
        }
        .prompt-card {
            background-color: #6d6b73;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
 </head>
 <body class="flex flex-col h-screen overflow-hidden">
  <header class="w-full px-6 py-5 flex items-center justify-between z-20 max-w-xl mx-auto">
   <div class="flex items-center gap-2 cursor-pointer" onclick="resetToHome()">
    <h1 class="text-3xl font-black tracking-tight omniforge-title-gradient drop-shadow-sm">OmniForge <span class="font-bold text-2xl text-blue-500">1.1</span></h1>
   </div>
   <button onclick="toggleGalleryModal(true)" class="text-white/90 hover:text-white font-medium text-lg flex items-center gap-2 hover:translate-x-1 transition-all duration-200"><span>Gallery</span> <i class="fa-solid fa-arrow-right text-sm"></i></button>
  </header>
  <main class="flex-1 flex flex-col items-center justify-between px-4 pb-2 max-w-xl mx-auto w-full overflow-y-auto">
   <div class="w-full flex-1 flex flex-col items-center justify-center min-h-[300px] my-2 relative">
    <div id="imageDisplayContainer" class="w-full aspect-square max-w-[420px] bg-black/90 rounded-2xl border border-white/5 shadow-2xl relative overflow-hidden flex items-center justify-center spotlight-bg group transition-all duration-300">
     <div class="absolute inset-0 opacity-20 pointer-events-none">
      <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
       <path d="M 0 100 C 30 60, 70 60, 100 100 Z" fill="rgba(255,255,255,0.1)"></path>
      </svg>
     </div>
     <div id="placeholderState" class="text-white/80 font-normal text-base md:text-lg text-center px-6 z-10">Created image will be here</div>
     <div id="loadingState" class="hidden flex-col items-center justify-center z-10 gap-4 p-6">
      <div class="relative w-16 h-16">
       <div class="absolute inset-0 rounded-full border-4 border-pink-500/20 animate-ping"></div>
       <div class="absolute inset-0 rounded-full border-4 border-t-pink-500 border-r-purple-500 border-b-blue-500 border-l-transparent animate-spin"></div>
      </div>
      <div class="text-center">
       <p id="loadingStatusText" class="text-white font-medium text-base">Forging your artwork...</p>
       <p id="loadingSubtext" class="text-white/50 text-xs mt-1">Connecting to Pollinations AI...</p>
      </div>
     </div>
     <div id="imageRenderWrapper" class="hidden w-full h-full relative group/img">
      <canvas id="outputCanvas" class="w-full h-full object-contain"></canvas>
      <div class="absolute top-3 right-3 flex gap-2 opacity-0 group-hover/img:opacity-100 transition-opacity duration-200">
       <button onclick="openFullscreenModal()" class="w-9 h-9 rounded-full bg-black/60 hover:bg-black/90 backdrop-blur-md text-white flex items-center justify-center border border-white/20 transition-all"><i class="fa-solid fa-expand text-sm"></i></button>
       <button onclick="downloadCurrentImage()" class="w-9 h-9 rounded-full bg-black/60 hover:bg-black/90 backdrop-blur-md text-white flex items-center justify-center border border-white/20 transition-all"><i class="fa-solid fa-download text-sm"></i></button>
      </div>
     </div>
    </div>
    <p class="text-white/70 text-xs md:text-sm text-center mt-3 font-normal px-4">Created images will be watermarked "<span class="font-semibold text-white/90">OmniForge</span>" on the corner</p>
   </div>
   <div class="w-full max-w-[420px] prompt-card p-5 pb-6 text-white relative mt-auto">
    <div class="relative w-full">
     <textarea id="promptInput" rows="2" placeholder="Tell me what to generate.." class="w-full bg-transparent text-white placeholder-white/80 font-normal text-base border-none outline-none resize-none leading-snug tracking-wide" onkeydown="handleKeyDown(event)"></textarea>
    </div>
    <div class="flex items-end justify-between mt-3 pt-1">
     <button onclick="openSettingsModal()" class="bg-black/20 hover:bg-black/30 border border-white/10 rounded-xl px-3.5 py-2 text-white/90 font-medium text-sm flex items-center gap-2 transition-colors cursor-pointer"><span id="selectedRatioModelLabel">1:1 - Flux</span> <i class="fa-solid fa-chevron-down text-xs text-white/60"></i></button>
     <button id="generateBtn" onclick="generateImage()" class="blue-submit-btn w-14 h-14 rounded-2xl flex items-center justify-center text-white text-2xl font-bold cursor-pointer shrink-0" title="Generate Image"><i class="fa-solid fa-arrow-up"></i></button>
    </div>
   </div>
  </main>
  <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
   <div class="bg-[#211d27] border border-white/10 rounded-3xl w-full max-w-md p-6 text-white shadow-2xl animate-in fade-in zoom-in-95 duration-200">
    <div class="flex items-center justify-between pb-4 border-b border-white/10">
     <h3 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-sliders text-pink-500"></i> Generation Options</h3>
     <button onclick="closeSettingsModal()" class="text-white/60 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="space-y-5 mt-4">
     <div>
      <label class="block text-xs uppercase tracking-wider text-white/60 mb-2 font-bold">AI Model Engine</label>
      <div class="grid grid-cols-2 gap-2" id="modelSelectorGroup">
       <button onclick="selectModel('flux')" data-model="flux" class="model-opt-btn active p-3 rounded-xl border border-pink-500/50 bg-pink-500/20 text-white text-left font-medium text-sm flex flex-col gap-1 transition-all"><span class="font-bold flex items-center justify-between">Flux <i class="fa-solid fa-circle-check text-pink
